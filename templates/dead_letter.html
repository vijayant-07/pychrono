<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead Letter Queue</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <style>
        body {
            background: #f5f7fb;
        }

        .dlq-shell {
            max-width: 1120px;
        }

        .dlq-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
    </style>
</head>

<body>
<main class="container dlq-shell py-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1">Dead Letter Queue</h1>
            <div class="text-secondary">Permanently failed jobs that need attention</div>
        </div>
        <a href="/dashboard" class="btn btn-outline-secondary">Back to Dashboard</a>
    </div>

    <section class="card dlq-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Task</th>
                        <th>Status</th>
                        <th>Retries</th>
                        <th>Error</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for job in jobs %}
                    <tr>
                        <td>
                            <a href="/jobs/{{ job.id }}/view" class="mono text-decoration-none">
                                {{ job.id[:8] }}
                            </a>
                        </td>
                        <td>{{ job.task }}</td>
                        <td><span class="badge text-bg-danger">FAILED</span></td>
                        <td>{{ job.retries }}</td>
                        <td class="text-danger">{{ job.last_error }}</td>
                        <td class="text-end">
                            <div class="btn-group btn-group-sm">
                                <a href="/jobs/{{ job.id }}/view" class="btn btn-outline-secondary">View</a>
                                <form method="POST" action="/jobs/{{ job.id }}/retry">
                                    <button class="btn btn-outline-danger" type="submit">
                                        Retry
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="6" class="text-center text-secondary py-5">
                            No dead-letter jobs found.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>

</html>
