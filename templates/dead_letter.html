<!DOCTYPE html>
<html>

<head>

<title>Dead Letter Queue</title>

<a
href="/dashboard/dead-letter"
class="btn btn-danger mb-3">

Dead Letter Queue

</a>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>
💀 Dead Letter Queue
</h2>

<a
href="/dashboard"
class="btn btn-secondary mb-3">

Back

</a>

<table class="table table-striped">

<tr>

<th>ID</th>

<th>Status</th>

<th>Retries</th>

<th>Error</th>

</tr>

{% for job in jobs %}

<tr>

<td>
{{ job.id }}
</td>

<td>

<span class="badge bg-danger">

FAILED

</span>

</td>

<td>

{{ job.retries }}

</td>

<td>

{{ job.last_error }}

</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
