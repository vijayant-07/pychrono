<!DOCTYPE html>
<html>

<head>

    <title>Job Details</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <a
        href="/dashboard"
        class="btn btn-secondary mb-3">

        ← Back

    </a>

    <div class="card">

        <div class="card-header">

            <h3>
                Job Details
            </h3>

        </div>

        <div class="card-body">

            <p>
                <strong>ID:</strong>
                {{ job.id }}
            </p>

            <p>
                <strong>Task:</strong>
                {{ job.task }}
            </p>

            <p>
                <strong>Status:</strong>
                {{ job.status }}
            </p>

            <p>
                <strong>Retries:</strong>
                {{ job.retries }}
            </p>

            <p>
                <strong>Run At:</strong>
                {{ job.run_at }}
            </p>

            <h5>
                Payload
            </h5>

            <pre>
{{ job.payload }}
            </pre>

        </div>

    </div>

</div>

</body>

</html>
